# Site settings
title: Sewade Ogun
tagline: Notes on speech, language models and multimodal AI
description: >-
  Sewade Ogun's blog. Notes on the rapidly changing field of AI, mostly through
  the lens of multimodality: speech language models, TTS, ASR and LLMs.
url: "https://ogunlao.github.io"
baseurl: ""
lang: en

author:
  name: Sewade Ogun
  email: sogun@aimsammi.org
  github: ogunlao
  twitter: SewadeOgun
  linkedin: sewade-ogun
  scholar: "https://scholar.google.com/citations?user=36Trrw4AAAAJ&hl=en"

twitter:
  username: SewadeOgun
social:
  name: Sewade Ogun
  links:
    - https://github.com/ogunlao
    - https://twitter.com/SewadeOgun
    - https://www.linkedin.com/in/sewade-ogun/
    - https://scholar.google.com/citations?user=36Trrw4AAAAJ

# Top navigation
menu:
  - { title: Posts, url: / }
  - { title: Archive, url: /archive/ }
  - { title: Publications, url: /publications.html }
  - { title: Projects, url: /projects.html }
  - { title: About, url: /about/ }
  - { title: Search, url: /search/ }

# Tags are hidden until there are enough posts to make them useful.
# To bring them back: set this to true, add `- { title: Tags, url: /tags/ }`
# to the menu above, and remove `published: false` from tags.html.
show_tags: false

# Comments
disqus:
  shortname: ogunlao

# Google Analytics 4 measurement ID ("G-XXXXXXXXXX").
# Leave empty to disable. Only rendered in production builds.
google_analytics: "G-T8J1T1HH6E"

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-redirect-from

paginate: 10
paginate_path: "/page/:num/"

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: distill
      comments: true
      use_math: true
  - scope: { path: "", type: pages }
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
